<svg width="1080" height="502" viewBox="0 0 1080 502" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="502" rx="28" fill="#F6EFE4"/>
  <rect x="24" y="24" width="1032" height="454" rx="22" fill="url(#dreamBg)" stroke="#1B1A17" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="910" cy="118" r="115" fill="url(#dreamOrb1)"/>
  <circle cx="170" cy="400" r="145" fill="url(#dreamOrb2)"/>

  <!-- Subtle technical grid -->
  <g stroke="#1B1A17" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="80" x2="1000" y2="80"/>
    <line x1="80" y1="160" x2="1000" y2="160"/>
    <line x1="80" y1="240" x2="1000" y2="240"/>
    <line x1="80" y1="320" x2="1000" y2="320"/>
    <line x1="80" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="60" x2="200" y2="440"/>
    <line x1="360" y1="60" x2="360" y2="440"/>
    <line x1="520" y1="60" x2="520" y2="440"/>
    <line x1="680" y1="60" x2="680" y2="440"/>
    <line x1="840" y1="60" x2="840" y2="440"/>
  </g>

  <!-- Minimal PCB trace motif on right -->
  <g opacity="0.75">
    <rect x="690" y="114" width="286" height="274" rx="22" fill="#FFFDF7" stroke="#1B1A17" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M742 182H808L834 208H914" stroke="#1D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M742 232H790L816 258H914" stroke="#C25A38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M742 288H842L868 314H914" stroke="#E0A458" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="742" cy="182" r="8" fill="#1D6B68"/>
    <circle cx="914" cy="208" r="8" fill="#1D6B68"/>
    <circle cx="742" cy="232" r="8" fill="#C25A38"/>
    <circle cx="914" cy="258" r="8" fill="#C25A38"/>
    <circle cx="742" cy="288" r="8" fill="#E0A458"/>
    <circle cx="914" cy="314" r="8" fill="#E0A458"/>
    <rect x="780" y="336" width="106" height="22" rx="11" fill="#F6EFE4" stroke="#C25A38" stroke-opacity="0.35"/>
    <text x="833" y="351" text-anchor="middle" fill="#C25A38" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">À VENIR</text>
  </g>

