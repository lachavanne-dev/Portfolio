    </radialGradient>
    <radialGradient id="dreamOrb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 400) rotate(90) scale(145)">
      <stop stop-color="#1D6B68" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1D6B68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dreamBar" x1="96" y1="352" x2="238" y2="352" gradientUnits="userSpaceOnUse">
