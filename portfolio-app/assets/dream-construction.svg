  <rect x="96" y="122" width="248" height="36" rx="18" fill="#C25A38" fill-opacity="0.12" stroke="#C25A38" stroke-opacity="0.35"/>
  <circle cx="120" cy="140" r="5" fill="#C25A38"/>
  <text x="136" y="145" fill="#C25A38" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">PAGE EN CONSTRUCTION</text>

  <!-- Title & metadata -->
  <text x="96" y="218" fill="#1B1A17" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">DREAM Électronique</text>
  <text x="96" y="264" fill="#1D6B68" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Stage BUT 3 · 2026 (18 semaines)</text>
  <text x="96" y="318" fill="#5A554E" font-family="Inter, Arial, sans-serif" font-size="18">Le contenu détaillé et les visuels seront ajoutés prochainement.</text>

  <!-- Progress bar accent -->
  <rect x="96" y="352" width="380" height="8" rx="4" fill="#1B1A17" fill-opacity="0.08"/>
  <rect x="96" y="352" width="142" height="8" rx="4" fill="url(#dreamBar)"/>

  <defs>
    <linearGradient id="dreamBg" x1="60" y1="40" x2="1020" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF7"/>
